# See .pre-commit-config.yaml/validate.yml, which call the same Makefile targets, keeping the
# three checks identical. Needs a Docker-capable runner (docker-in-docker, set up below); see
# README's "Contributing" section for what that requires.

image: docker:27-cli

services:
  - docker:27-dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

stages:
  - validate

default:
  before_script:
    - apk add --no-cache make git
    - make docker-image

.on-mr-or-default-branch: &on-mr-or-default-branch
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# One job per check, so they run in parallel: none needs another's result, only its own Makefile
# prerequisites.
validate:
  stage: validate
  parallel:
    matrix:
      - TARGET:
          - fmt
          - validate
          - apply
          - check-team-hierarchy
          - check-reviewable-expiration
          - check-scripts
  script:
    - make $TARGET
  rules: *on-mr-or-default-branch

validate-retirement-confirmations:
  stage: validate
  variables:
    GIT_DEPTH: "0" # full history -- the check needs `git worktree add` on an arbitrary base SHA, same as mr-diff-summary below
  script:
    - make check-retirement-confirmations BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}"
  rules: *on-mr-or-default-branch

# Separate from `validate` on purpose -- delete this job if examples/ goes away.
validate-examples:
  stage: validate
  script:
    - make check-examples
  rules: *on-mr-or-default-branch

# Same reasoning as validate-examples -- delete this job if tools/orgapi goes away.
validate-orgapi:
  stage: validate
  script:
    - make check-orgapi
  rules: *on-mr-or-default-branch

# Same reasoning as validate-examples -- delete this job if tools/orgviewer goes away.
validate-orgviewer:
  stage: validate
  script:
    - make check-orgviewer
  rules: *on-mr-or-default-branch

# Same reasoning as validate-examples -- delete this job if tools/orgconfluence goes away.
validate-orgconfluence:
  stage: validate
  script:
    - make check-orgconfluence
  rules: *on-mr-or-default-branch

# GitHub equivalent: pr-diff-summary.yml, calling the same diff-summary/post-review-comment
# targets with different PLATFORM/env values. Needs a GITLAB_MR_TOKEN CI/CD variable (project
# access token, `api` scope) -- GitLab's built-in CI_JOB_TOKEN has known Notes-API permission
# gaps. See README's "Contributing".
mr-diff-summary:
  stage: validate
  variables:
    GIT_DEPTH: "0" # full history -- `git worktree add` needs an arbitrary base SHA, which a shallow clone may lack
  script:
    - make diff-summary BASE_SHA="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - make post-review-comment PLATFORM=gitlab
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "org-model/**/*"
        - "org-model/*"
  allow_failure: true
