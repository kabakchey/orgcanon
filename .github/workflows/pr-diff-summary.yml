# Informational only -- never blocks a PR. GitLab equivalent: .gitlab-ci.yml's mr-diff-summary
# job, calling the same diff-summary/post-review-comment Make targets with different
# PLATFORM/REPO/PR_NUMBER values. Runs inside the root Dockerfile's image, which carries `gh` for
# exactly this.
name: PR org-data diff summary

on:
  pull_request:
    paths:
      - "org-model/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: build tooling image
        run: make docker-image

      - name: Generate diff summary
        run: make diff-summary BASE_SHA="${{ github.event.pull_request.base.sha }}"

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make post-review-comment PLATFORM=github \
            REPO="${{ github.repository }}" \
            PR_NUMBER="${{ github.event.pull_request.number }}"
