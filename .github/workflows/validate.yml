# See .pre-commit-config.yaml/.gitlab-ci.yml, which call the same Makefile targets, keeping the
# three checks identical. ubuntu-latest ships Docker preinstalled, so no
# setup-python/setup-node/setup-terraform action is needed.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # One job per check, so they run in parallel: none needs another's result, only its own
  # Makefile prerequisites.
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fmt
          - validate
          - apply
          - check-team-hierarchy
          - check-reviewable-expiration
          - check-scripts
    steps:
      - uses: actions/checkout@v4

      - name: build tooling image
        run: make docker-image

      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}

  validate-retirement-confirmations:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 -- the check needs `git worktree add` on an arbitrary base SHA, same
      # reasoning as pr-diff-summary.yml's checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: build tooling image
        run: make docker-image

      - name: role/authority-line/head-deputy retirement confirmation check
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: make check-retirement-confirmations BASE_SHA="$BASE_SHA"

  # Separate from `validate` on purpose -- delete this job if examples/ goes away.
  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build tooling image
        run: make docker-image

      - name: validate examples/
        run: make check-examples

  # Same reasoning as validate-examples -- delete this job if tools/orgapi goes away.
  validate-orgapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build tooling image
        run: make docker-image

      - name: orgapi checks
        run: make check-orgapi

  # Same reasoning as validate-examples -- delete this job if tools/orgviewer goes away.
  validate-orgviewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build tooling image
        run: make docker-image

      - name: orgviewer checks
        run: make check-orgviewer

  # Same reasoning as validate-examples -- delete this job if tools/orgconfluence goes away.
  validate-orgconfluence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build tooling image
        run: make docker-image

      - name: orgconfluence checks
        run: make check-orgconfluence
