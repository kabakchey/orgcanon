[project]
name = "orgapi"
version = "0.1.0"
description = "HTTP API over the org-as-code data model (fetch by id, fetch-all, filter by basic attrs). No UI, no auth."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "fastapi-mcp>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx2>=2.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orgapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".dist/pytest_cache"
